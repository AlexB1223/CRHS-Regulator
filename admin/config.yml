# Editor’s Desk settings. Change the repo line below to YOUR GitHub username and repository name.
backend:
  name: github
  repo: AlexB1223/CRHS-Regulator
  branch: main

# Optional: uncomment to make writers submit drafts that an editor approves before they go live.
# publish_mode: editorial_workflow

media_folder: images
public_folder: /images
locale: en

collections:
  - name: articles
    label: Articles
    files:
      - name: articles
        label: All Articles
        file: content/articles.json
        fields:
          - label: Articles
            name: articles
            widget: list
            label_singular: Article
            summary: "{{fields.date}} | {{fields.title}}"
            fields:
              - { label: Headline, name: title, widget: string }
              - { label: Subhead (optional), name: deck, widget: string, required: false }
              - label: Section
                name: section
                widget: select
                options: [News, Sports, Opinion, Arts, Student Life]
              - { label: Byline, name: author, widget: string, default: Staff }
              - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: Photo (optional), name: image, widget: image, required: false }
              - { label: Story, name: body, widget: text, hint: "Leave a blank line between paragraphs. Use **bold** and *italics* if you like." }

  - name: site
    label: Site Text
    files:
      - name: site
        label: Masthead, Footer and Labels
        file: content/site.json
        fields:
          - { label: Newspaper name, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string, required: false }
          - { label: Top line (next to the date), name: ear, widget: string }
          - { label: Volume label, name: vol, widget: string }
          - { label: Front page tab label, name: front_label, widget: string }
          - { label: Empty section message, name: empty_message, widget: string }
          - { label: Footer text, name: footer, widget: string }
